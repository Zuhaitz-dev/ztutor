services:
  ztutor:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ztutor:latest
    restart: unless-stopped
    ports:
      - "2222:2222"
    volumes:
      # Persistent state: SSH host key, SQLite DB.
      - ztutor-data:/data
      # Course content — edit on the host, picked up on next restart.
      - ./courses:/courses:ro
    environment:
      # Optional: max SSH connections (default 200).
      # Set via ztutor.json mounted into /data, or use the env var below.
    # Uncomment to mount a custom ztutor.json config:
    # configs:
    #   - source: ztutor_config
    #     target: /data/ztutor.json

volumes:
  ztutor-data:

# configs:
#   ztutor_config:
#     file: ./ztutor.json
